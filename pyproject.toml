[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "Local MCP server: move/rename notes and folders in an Obsidian vault while keeping links (via the official Obsidian CLI)."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
